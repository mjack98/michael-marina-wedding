<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Michael & Marina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Parisienne&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0d2818;
    --emerald:#1b4332;
    --emerald-deep:#0f2d1f;
    --gold:#c9a961;
    --gold-soft:#e2cd97;
    --ivory:#f7f1e6;
    --blush:#efe4cf;
    --paper:#eee7d6;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:
      radial-gradient(ellipse at 50% 20%, rgba(201,169,97,0.12), transparent 55%),
      linear-gradient(180deg, var(--emerald-deep) 0%, var(--emerald) 60%, #163a27 100%);
    color:var(--ivory);
    font-family:'Cormorant Garamond', serif;
    min-height:100svh;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    -webkit-tap-highlight-color: transparent;
  }

  .stage{
    position:relative;
    width:min(420px, 86vw);
    aspect-ratio: 3/4;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    user-select:none;
  }

  /* Envelope */
  .envelope{
    position:absolute; inset:0;
    opacity:0; transform:scale(0.92) translateY(14px);
    animation: envelopeIn 1.1s cubic-bezier(.2,.7,.3,1) forwards;
    animation-delay:0.15s;
  }
  @keyframes envelopeIn{
    to{ opacity:1; transform:scale(1) translateY(0); }
  }

  .paper{
    position:absolute; inset:0;
    background:var(--paper);
    box-shadow: 0 30px 60px rgba(0,0,0,0.45), 0 0 0 1px rgba(201,169,97,0.35) inset;
  }

  /* embossed corner florals, echoing the reference card */
  .emboss{ position:absolute; stroke:rgba(27,67,50,0.18); fill:none; stroke-width:1; }
  .emboss.tl{ top:6%; left:5%; width:26%; }
  .emboss.br{ bottom:6%; right:5%; width:26%; transform:rotate(180deg); }

  /* Envelope flap */
  .flap{
    position:absolute; top:0; left:0; width:100%; height:52%;
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    background: linear-gradient(160deg, var(--paper), #e4dcc6);
    box-shadow: 0 1px 0 rgba(27,67,50,0.15) inset;
    transform-origin: top center;
    transition: transform 1.1s cubic-bezier(.6,-0.1,.2,1), opacity 0.9s ease;
  }
  .stage.open .flap{
    transform: rotateX(178deg);
    opacity:0.15;
  }

  /* Wax seal */
  .seal-wrap{
    position:absolute; left:50%; top:50%;
    transform:translate(-50%,-46%) scale(0);
    animation: sealDrop 0.7s cubic-bezier(.34,1.56,.64,1) forwards;
    animation-delay:1.05s;
    z-index:3;
    transition: transform 0.7s cubic-bezier(.5,0,.4,1), opacity 0.6s ease;
  }
  @keyframes sealDrop{
    to{ transform:translate(-50%,-46%) scale(1); }
  }
  .stage.open .seal-wrap{
    transform:translate(-50%,-46%) scale(0.7);
    opacity:0;
  }

  .seal{ width:132px; height:132px; display:block; }
  .seal-ring{ fill:#cdae7d; }
  .seal-ring-2{ fill:#dcc296; }
  .seal-face{ fill:#d6bb8b; }
  .seal-highlight{ fill:rgba(255,255,255,0.18); }

  .letter{
    font-family:'Parisienne', cursive;
    font-size:44px;
    fill:#8a6a35;
    opacity:0;
  }
  .letter.m1{ animation: letterIn 0.6s ease forwards; animation-delay:1.55s; }
  .amp{
    font-family:'Parisienne', cursive;
    font-size:22px;
    fill:#8a6a35;
    opacity:0;
    animation: letterIn 0.6s ease forwards; animation-delay:1.8s;
  }
  .letter.m2{ animation: letterIn 0.6s ease forwards; animation-delay:2.0s; }
  @keyframes letterIn{
    from{ opacity:0; transform:scale(0.4) translateY(6px); }
    to{ opacity:1; transform:scale(1) translateY(0); }
  }

  .glow{
    position:absolute; inset:-18px; border-radius:50%;
    box-shadow:0 0 0 0 rgba(201,169,97,0.0);
    animation: pulseGlow 2.4s ease-in-out infinite;
    animation-delay:2.6s;
    opacity:0;
  }
  @keyframes pulseGlow{
    0%{ box-shadow:0 0 0 0 rgba(201,169,97,0.0); opacity:0; }
    50%{ box-shadow:0 0 26px 6px rgba(201,169,97,0.35); opacity:1; }
    100%{ box-shadow:0 0 0 0 rgba(201,169,97,0.0); opacity:0; }
  }

  .prompt{
    position:absolute; left:0; right:0; bottom:9%;
    text-align:center;
    font-family:'Montserrat', sans-serif;
    letter-spacing:0.32em; text-transform:uppercase;
    font-size:0.68rem; color:#ffd700;
    text-shadow: 0 0 8px rgba(255,215,0,0.6);
    opacity:0;
    animation: fadeUp 0.9s ease forwards;
    animation-delay:2.9s;
  }
  @keyframes fadeUp{
    from{ opacity:0; transform:translateY(8px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .prompt span{
    display:inline-block;
    animation: softBounce 1.8s ease-in-out infinite;
    animation-delay:3.2s;
  }
  @keyframes softBounce{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-4px); }
  }

  .names-above{
    position:absolute; top:9%; left:0; right:0; text-align:center;
    font-family:'Montserrat', sans-serif; font-weight:300;
    letter-spacing:0.4em; text-transform:uppercase; font-size:0.65rem;
    color:rgba(13,40,24,0.55);
    opacity:0;
    animation: fadeUp 0.9s ease forwards;
    animation-delay:0.75s;
  }

  .stage.open .prompt, .stage.open .names-above{ opacity:0; transition:opacity 0.3s ease; }

  .fade-out{
    position:fixed; inset:0; background:var(--emerald-deep);
    opacity:0; pointer-events:none;
    transition:opacity 0.7s ease;
    z-index:10;
  }
  .fade-out.on{ opacity:1; pointer-events:all; }

  @media (prefers-reduced-motion: reduce){
    .envelope, .seal-wrap, .letter, .amp, .prompt, .prompt span, .names-above, .glow{
      animation:none !important; opacity:1 !important; transform:none !important;
    }
  }

  /* Reference-inspired envelope composition */
  body{background:radial-gradient(ellipse at 50% 20%,rgba(255,255,255,.7),transparent 55%),#f4eee5;color:#4b2028}
  .stage{width:min(560px,94vw);aspect-ratio:4/3}
  .paper{inset:auto 0 0;height:60%;background:linear-gradient(145deg,#722b39,#571e2a);box-shadow:0 24px 45px rgba(72,35,37,.18),0 0 0 1px rgba(255,255,255,.12) inset}
  .flap{top:40%;height:60%;background:linear-gradient(160deg,#722b39,#491723);box-shadow:0 1px 0 rgba(255,255,255,.12) inset}
  .emboss{stroke:rgba(255,228,205,.18)}
  .photo{position:absolute;z-index:2;top:5%;left:24%;width:53%;height:55%;object-fit:cover;object-position:center 28%;padding:8px;background:#fff;box-shadow:0 12px 22px rgba(55,22,28,.22);transform:rotate(8deg);transition:transform 1s cubic-bezier(.6,-.1,.2,1),opacity .8s ease}
  .stage.open .photo{transform:translateY(-12%) rotate(8deg);opacity:.2}
  .florals{position:absolute;z-index:3;left:10%;top:15%;width:32%;height:46%;transform:rotate(-12deg);pointer-events:none}
  .florals::before{content:'✦  ✿  ❁';position:absolute;color:#7a2332;font-size:2.5rem;line-height:1.15;text-shadow:1.4rem 2rem 0 #b48b52,2.8rem 3.2rem 0 #7a2332}
  .florals::after{content:'';position:absolute;left:42%;top:4%;width:2px;height:100%;background:#a98254;transform:rotate(18deg);box-shadow:-18px 40px 0 #a98254,15px 70px 0 #a98254}
  .names-above{top:2%;color:rgba(87,30,42,.78)}
  .seal-wrap{top:67%}
  .seal-ring{fill:#b27a35}.seal-ring-2{fill:#d6a957}.seal-face{fill:#c89443}
  .letter,.seal .amp{display:none}.heart{font-family:Georgia,serif;font-size:62px;fill:#5a2b1d;opacity:1}.prompt{bottom:3%;color:#571e2a;text-shadow:none}
  .fade-out{background:#3d1420}
  @media(max-width:600px){.stage{aspect-ratio:3/4}.photo{left:20%;width:60%;height:53%}.florals{left:4%;width:38%}}
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="envelope">
    <div class="paper"></div>
    <img class="photo" src="couple.jpg" alt="Michael and Marina together">
    <div class="florals" aria-hidden="true"></div>

    <svg class="emboss tl" viewBox="0 0 100 100"><path d="M10 90 Q20 60 40 55 Q35 40 50 30 Q60 45 55 60 Q75 55 90 70" stroke-linecap="round"/></svg>
    <svg class="emboss br" viewBox="0 0 100 100"><path d="M10 90 Q20 60 40 55 Q35 40 50 30 Q60 45 55 60 Q75 55 90 70" stroke-linecap="round"/></svg>

    <div class="names-above">Michael &amp; Marina</div>

    <div class="flap"></div>

    <div class="seal-wrap" id="sealWrap">
      <div class="glow"></div>
      <svg class="seal" viewBox="0 0 132 132">
        <circle class="seal-ring" cx="66" cy="66" r="64"/>
        <circle class="seal-ring-2" cx="66" cy="66" r="55"/>
        <circle class="seal-face" cx="66" cy="66" r="48"/>
        <ellipse class="seal-highlight" cx="48" cy="42" rx="20" ry="12"/>
        <text class="heart" x="66" y="87" text-anchor="middle">♡</text>
        <text class="letter m1" x="40" y="70" text-anchor="middle">M</text>
        <text class="amp" x="66" y="86" text-anchor="middle">&amp;</text>
        <text class="letter m2" x="92" y="70" text-anchor="middle">M</text>
      </svg>
    </div>

    <div class="prompt">
      <div style="font-size: 1.1rem; margin-bottom: 4px; color: #a0826d; font-weight: 500;">Tap the seal to open</div>
    </div>
  </div>
</div>

<div class="fade-out" id="fadeOut"></div>

<script>
  const stage = document.getElementById('stage');
  const fadeOut = document.getElementById('fadeOut');
  let opened = false;

  stage.addEventListener('click', () => {
    if(opened) return;
    opened = true;
    stage.classList.add('open');
    setTimeout(() => { fadeOut.classList.add('on'); }, 650);
    setTimeout(() => { window.location.href = 'invitation.html'; }, 1350);
  });
</script>

</body>
</html>
